<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotlight Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --x: 50vw;
    --y: 42vh;
    --r-core: 90px;
    --r-edge: 360px;
    --glow-strength: 1;
    --paper: #f3efe6;
    --ink: #0a0a0a;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background: var(--ink);
    overflow: hidden;
    font-family: 'Jost', sans-serif;
  }

  body{
    cursor: default;
  }

  .stage{
    position: relative;
    width: 100vw;
    height: 100vh;
    opacity: 0;
    animation: stage-in 1.6s cubic-bezier(.16,.8,.2,1) forwards;
  }

  @keyframes stage-in{
    from{ opacity: 0; filter: brightness(0.7); }
    to{ opacity: 1; filter: brightness(1); }
  }

  .art-layer{
    position: absolute;
    inset: -2%;
    width: 104%;
    height: 104%;
    background:
      radial-gradient(ellipse 46% 30% at 50% 40%, rgba(230,225,214,0.95) 0%, rgba(200,194,182,0.55) 45%, transparent 72%),
      radial-gradient(ellipse 22% 34% at 35% 62%, rgba(214,208,196,0.85) 0%, rgba(180,174,162,0.4) 55%, transparent 75%),
      radial-gradient(ellipse 22% 34% at 65% 62%, rgba(214,208,196,0.85) 0%, rgba(180,174,162,0.4) 55%, transparent 75%),
      radial-gradient(ellipse 60% 45% at 50% 78%, rgba(150,145,135,0.55) 0%, transparent 70%),
      linear-gradient(180deg, #050505 0%, #0c0c0c 60%, #050505 100%);
    background-size: cover;
    background-position: center;
    transition: transform 1.2s cubic-bezier(.16,.8,.2,1);
    will-change: transform;
  }

  .art-layer.bright{
    filter: brightness(1.08) contrast(1.05) saturate(0.9);
    background-image: url("foto.jpg");
  }

  .art-layer.dark{
    filter: brightness(0.08) contrast(1.18) saturate(0.65);
    -webkit-mask-image: radial-gradient(circle var(--r-edge) at var(--x) var(--y),
        transparent 0px,
        transparent var(--r-core),
        rgba(0,0,0,1) 100%);
    mask-image: radial-gradient(circle var(--r-edge) at var(--x) var(--y),
        transparent 0px,
        transparent var(--r-core),
        rgba(0,0,0,1) 100%);
    background-image: url("foto.jpg");
  }

  .glow{
    position: absolute;
    inset: 0;
    pointer-events: none;
    mix-blend-mode: screen;
    opacity: var(--glow-strength);
    background: radial-gradient(circle 460px at var(--x) var(--y),
        rgba(255,247,232,0.10) 0%,
        rgba(255,240,218,0.08) 12%,
        rgba(255,225,190,0.055) 26%,
        rgba(255,210,165,0.032) 42%,
        rgba(255,200,150,0.016) 58%,
        rgba(255,200,150,0.006) 74%,
        transparent 92%);
  }

  .vignette{
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(ellipse 80% 70% at 50% 50%, transparent 55%, rgba(0,0,0,0.55) 100%);
  }

  .grain{
    position:absolute;
    inset:-20px;
    pointer-events:none;
    opacity:0.045;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation: grain-drift 8s steps(6) infinite;
  }

  @keyframes grain-drift{
    0%   { transform: translate(0,0); }
    20%  { transform: translate(-2%,2%); }
    40%  { transform: translate(2%,-1%); }
    60%  { transform: translate(-1%,-2%); }
    80%  { transform: translate(1%,2%); }
    100% { transform: translate(0,0); }
  }

  .nav{
    position:absolute;
    top:0;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:2.6rem;
    padding: 1.8rem 2rem 1.4rem;
    z-index: 5;
    opacity: 0;
    animation: fade-down 1s ease-out 0.5s forwards;
  }

  .nav a{
    color: rgba(243,239,230,0.88);
    text-decoration:none;
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    font-weight: 500;
    transition: color 0.3s ease, opacity 0.3s ease;
  }

  .nav a:hover{
    color: var(--paper);
  }

  .nav a.active{
    border-bottom: 1px solid rgba(243,239,230,0.6);
    padding-bottom: 4px;
  }

  .caption{
    position:absolute;
    left:50%;
    bottom: 6.5vh;
    transform: translateX(-50%);
    text-align:center;
    width: min(560px, 86vw);
    z-index: 5;
    pointer-events:none;
    opacity: 0;
    animation: fade-up 1.1s cubic-bezier(.16,.8,.2,1) 0.75s forwards;
  }

  .caption .eyebrow{
    font-family:'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    color: var(--paper);
    font-size: 1.15rem;
    margin: 0 0 0.2rem;
    opacity:0.9;
  }

  .caption h1{
    font-family:'Cormorant Garamond', serif;
    font-weight: 400;
    color: var(--paper);
    font-size: clamp(1.6rem, 4.2vw, 2.6rem);
    letter-spacing: 0.14em;
    margin: 0 0 0.9rem;
  }

  .caption p{
    color: rgba(243,239,230,0.6);
    font-size: 0.78rem;
    line-height: 1.7;
    margin: 0;
  }

  @keyframes fade-down{
    from{ opacity:0; transform: translateY(-10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @keyframes fade-up{
    from{ opacity:0; transform: translate(-50%, 14px); }
    to{ opacity:1; transform: translate(-50%, 0); }
  }

  @media (prefers-reduced-motion: reduce){
    .stage, .nav, .caption, .grain{
      animation: none !important;
      opacity: 1 !important;
    }
  }

  @media (max-width: 640px){
    .nav{
      gap: 1.2rem;
      padding: 1.2rem 1rem;
      flex-wrap: wrap;
    }

    .nav a{
      font-size: 0.62rem;
    }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="art-layer bright"></div>
  <div class="art-layer dark"></div>
  <div class="glow"></div>
  <div class="vignette"></div>
  <div class="grain"></div>

  <div class="caption">
    <p class="eyebrow">An</p>
    <h1>UNTITLED FIGURE</h1>
    <p>A study in light and shadow — move your cursor across the frame to bring the piece out of the dark. Replace this artwork and text with your own.</p>
  </div>
</div>

<script>
  const root = document.documentElement;
  const brightLayer = document.querySelector('.art-layer.bright');
  const darkLayer   = document.querySelector('.art-layer.dark');

  let targetX = window.innerWidth / 2;
  let targetY = window.innerHeight / 2.4;
  let curX = targetX;
  let curY = targetY;

  const SMOOTH_HALF_LIFE = 90;
  let lastFrame = performance.now();
  let idleTimer = null;
  let isIdle = false;

  function wake(){
    isIdle = false;
    root.style.setProperty('--glow-strength', 1);
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => { isIdle = true; }, 2600);
  }

  function setTarget(x, y){
    targetX = x;
    targetY = y;
    wake();
  }

  window.addEventListener('mousemove', (e) => setTarget(e.clientX, e.clientY));

  window.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (!t) return;
    setTarget(t.clientX, t.clientY);
  }, { passive: true });

  window.addEventListener('mouseleave', () => {
    root.style.setProperty('--glow-strength', 0.35);
  });

  window.addEventListener('mouseenter', () => {
    root.style.setProperty('--glow-strength', 1);
  });

  let driftT = 0;

  function tick(now){
    const dt = Math.min(now - lastFrame, 48);
    lastFrame = now;

    if (isIdle){
      driftT += dt * 0.0006;
      targetX += Math.cos(driftT) * 0.6;
      targetY += Math.sin(driftT * 1.3) * 0.4;
    }

    const factor = 1 - Math.pow(0.5, dt / SMOOTH_HALF_LIFE);
    curX += (targetX - curX) * factor;
    curY += (targetY - curY) * factor;

    root.style.setProperty('--x', curX.toFixed(1) + 'px');
    root.style.setProperty('--y', curY.toFixed(1) + 'px');

    const nx = (curX / window.innerWidth - 0.5);
    const ny = (curY / window.innerHeight - 0.5);
    const px = (-nx * 10).toFixed(2);
    const py = (-ny * 8).toFixed(2);

    brightLayer.style.transform = `translate(${px}px, ${py}px) scale(1.03)`;
    darkLayer.style.transform   = `translate(${px}px, ${py}px) scale(1.03)`;

    requestAnimationFrame(tick);
  }

  wake();
  requestAnimationFrame(tick);
</script>

</body>
</html>
